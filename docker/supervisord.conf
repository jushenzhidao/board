; supervisor 进程守护：nginx + 桥接服务（dev_bridge.py）
; 环境变量（BOARD_TOKEN / BRIDGE_HOST / BRIDGE_PORT 等）从 docker run -e / compose environment 继承

[program:bridge]
command=python /app/scripts/dev_bridge.py
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
