# 容器内 nginx 配置：静态托管 dist + 反代 /ch/ 到桥接（127.0.0.1:8123）
server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # 站点索引与渠道映射：运行时由桥接/sync 生成，挂载在 /app/public
    # 前端请求 /sites.json 与 /channels/<site>.json，直接从此目录提供
    location = /sites.json {
        root /app/public;
    }
    location /channels/ {
        root /app/public;
    }

    # /ch/ 反代到桥接服务（dev_bridge.py，容器内 127.0.0.1:8123）
    # X-Site / X-Board-Token / Authorization 等请求头默认透传，桥接负责路由与鉴权
    location /ch/ {
        proxy_pass http://127.0.0.1:8123/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
