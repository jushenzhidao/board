# =============================================================================
# 渠道看板 —— 镜像构建工作流（GitHub Actions）
#
# 作用：代码 push / 打 tag / 手动触发时，自动构建 Docker 镜像并推送到 GHCR。
# 凭据（config/sites.json）与令牌（BOARD_TOKEN）均不进镜像，部署时通过
# docker-compose 的 env 与 volume 注入，见 README「Docker 部署」。
#
# 触发：
#   - push 到 main/master  → 镜像 tag：<分支名>、<commit-sha>、（默认分支）latest
#   - push v* 标签         → 镜像 tag：<版本>、<major.minor>、<semver>
#   - 手动 workflow_dispatch
#
# 推送目标：ghcr.io/<owner>/channel-board（GitHub 原生容器仓库，无需额外密钥，
# 使用内置 GITHUB_TOKEN）。如需 Docker Hub，取消下方对应注释并配置 secret。
# =============================================================================

name: Build & Push Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: channel-board

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 如需同时推送 Docker Hub，取消注释并配置仓库 secrets：
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像标签：latest（默认分支）/ 分支名 / commit-sha / semver 版本
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存加速构建（缓存 node_modules 与 pip 层）
          cache-from: type=gha
          cache-to: type=gha,mode=max
