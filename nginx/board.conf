# nginx 生产部署配置示例（渠道看板）
# 放置到 nginx conf.d / 宝塔面板站点配置中，按需修改 server_name 和路径

server {
    listen 80;
    server_name board.internal;          # 换成内网域名或 IP

    # 1) 前端静态资源（npm run build 产物，拷贝到 /data/channel-board/dist）
    root /data/channel-board/dist;
    index index.html;

    # 2) /ch/ 反代到 ClickHouse HTTP 接口
    #    ClickHouse 的 8123 无需对公网开放，nginx 与 CH 同机时走 127.0.0.1
    location /ch/ {
        proxy_pass http://127.0.0.1:8123/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 方案 A（推荐）：凭据放服务端，前端"连接设置"里密码留空、用户名任意
        # proxy_set_header Authorization "Basic <base64(user:password)>";
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：限制只有内网访问
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;
}

# 说明：
# - ClickHouse HTTP 端口（8123）需在 CH 容器/服务中开启（当前服务器只开放了原生 9000）。
#   若 CH 跑在 Docker 且由 new-api 直写，可在 docker-compose 中给 CH 增加端口映射 8123，
#   或 nginx 直接代理到 CH 容器内网地址。
# - 建议为看板单独创建只读账号：
#     CREATE USER board_ro IDENTIFIED BY '<password>';
#     GRANT SELECT ON new_api_logs.* TO board_ro;
#   然后用方案 A 的 proxy_set_header 注入 Basic 认证。
